# Extends the gitleaks default ruleset. The canary decoys are deliberate fake
# secrets; they are NOT allowlisted so they act as a positive control: a scan
# that reports nothing for workspace/canary means the scanner is broken.
title = "secenv gitleaks"

[extend]
useDefault = true

[[rules]]
id = "secenv-canary-marker"
description = "secenv canary marker outside its decoy directory"
regex = '''CNRY-[A-Za-z]+-[A-Za-z0-9_-]+'''
tags = ["canary"]
