# Language-agnostic recognizers, instantiated for both German and English.
# The upstream defaults register most of them for "en" only, which would leave
# German requests without e-mail/IBAN/card detection.
supported_languages:
  - de
  - en
global_regex_flags: 26

recognizers:
  - name: SpacyRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: EmailRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: PhoneRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: CreditCardRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: IbanRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: IpRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: UrlRecognizer
    supported_languages: [de, en]
    type: predefined
  - name: CryptoRecognizer
    supported_languages: [de, en]
    type: predefined
