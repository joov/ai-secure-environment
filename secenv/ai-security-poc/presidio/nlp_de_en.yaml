# NLP engine for the PII analyzer: German (primary) and English models.
# German spaCy labels differ from the English ones (PER/LOC/ORG/MISC, no DATE),
# so DATE_TIME is no longer produced by NER on German text.
nlp_engine_name: spacy
models:
  - lang_code: de
    model_name: de_core_news_lg
  - lang_code: en
    model_name: en_core_web_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    FAC: LOCATION
    NORP: NRP
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME
  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
  labels_to_ignore:
    - ORGANIZATION
    - MISC
    - CARDINAL
    - EVENT
    - LANGUAGE
    - LAW
    - MONEY
    - ORDINAL
    - PERCENT
    - PRODUCT
    - QUANTITY
    - WORK_OF_ART
