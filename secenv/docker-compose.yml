name: secenv

services:
  llm-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      MLX_UPSTREAM: http://host.docker.internal:${MLX_PORT}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY}
      MLX_MODEL: ${MLX_MODEL}
      PROXY_LOG: /logs/proxy.log
    volumes:
      - ./logs:/logs
      - ./config:/config:ro
      - ./iac:/iac:ro
    ports:
      - "127.0.0.1:${SECENV_PROXY_PORT}:8080"
    networks: [internal, egress]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped

  sandbox:
    build: ./sandbox
    environment:
      OPENAI_BASE_URL: http://llm-proxy:8080/v1
      OPENAI_API_KEY: ${LOCAL_LLM_API_KEY}
      MLX_MODEL: ${MLX_MODEL}
    volumes:
      - ./workspace:/workspace
      - ./logs:/logs
      - ./config:/config:ro
      - ./iac:/iac:ro
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped

networks:
  internal:
    name: secenv_internal
    internal: true
  egress:
    name: secenv_egress
