name: secenv

services:
  registry:
    build: ./runtime
    command: ["python", "/app/registry.py"]
    environment:
      AGENTS_FILE: /agents/agents.json
      SECRET_ROOT: /secrets
    volumes:
      - ./agents/agents.json:/agents/agents.json:ro
      - ./secrets:/secrets
    user: "0:0"
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest-static
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  hitl:
    build: ./runtime
    command: ["python", "/app/hitl.py"]
    ports:
      - "127.0.0.1:${HITL_PORT}:8080"
    networks: [control, publish]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ledger:
    build: ./runtime
    command: ["python", "/app/ledger.py"]
    environment:
      LEDGER_FILE: /data/ledger.jsonl
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${LEDGER_PORT}:8080"
    networks: [control, publish]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  broker:
    build: ./runtime
    command: ["python", "/app/broker.py"]
    environment:
      REGISTRY_URL: http://registry:8080
      OPA_URL: http://opa:8181
      HITL_URL: http://hitl:8080
      LEDGER_URL: http://ledger:8080
      WORKSPACE: /workspace
      HITL_TIMEOUT_SEC: ${HITL_TIMEOUT_SEC}
      MLX_UPSTREAM: http://host.docker.internal:${MLX_PORT}/v1
      MLX_MODEL: ${MLX_MODEL}
      MLX_API_KEY: ${LOCAL_LLM_API_KEY}
      MCP_URL: http://dummy-mcp:8080
    volumes:
      - ./workspace:/workspace:ro
    ports:
      - "127.0.0.1:${BROKER_PORT}:8080"
    networks: [control, agents, egress]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [registry, opa, hitl, ledger, dummy-mcp]
    restart: unless-stopped

  dummy-mcp:
    build: ./runtime
    command: ["python", "/app/dummy_mcp.py"]
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  agent-a:
    build: ./runtime
    command: ["python", "/app/harness.py"]
    environment:
      AGENT_ID: agent-a
      BROKER_URL: http://broker:8080
      TOOL: ping
      PROMPT: Say hi
      TOKEN_FILE: /secrets/token
    volumes:
      - ./secrets/agent-a:/secrets:ro
      - ./workspace:/workspace:ro
    networks: [agents]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [broker]
    restart: unless-stopped

  agent-b:
    build: ./runtime
    command: ["python", "/app/harness.py"]
    environment:
      AGENT_ID: agent-b
      BROKER_URL: http://broker:8080
      TOOL: secret_lookup
      PROMPT: Say hi
      TOKEN_FILE: /secrets/token
    volumes:
      - ./secrets/agent-b:/secrets:ro
      - ./workspace:/workspace:ro
    networks: [agents]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [broker]
    restart: unless-stopped

networks:
  control:
    internal: true
  agents:
    internal: true
  publish:
  egress:
