name: paperclip

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperclip
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control]
    restart: unless-stopped

  paperclip:
    image: ${PAPERCLIP_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PAPERCLIP_BIND: lan
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: http://localhost:${PAPERCLIP_PORT}
      PAPERCLIP_ALLOWED_HOSTNAMES: localhost,127.0.0.1
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:${PAPERCLIP_PORT},http://127.0.0.1:${PAPERCLIP_PORT}
      PAPERCLIP_HTTP_ADAPTER_PRIVATE_ENDPOINT_ALLOWLIST: http://operator:3199
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:${PAPERCLIP_PORT}:3100"
    volumes:
      - ./data/paperclip:/paperclip
      - ./logs:/logs
      - ./config:/config:ro
      - "${HOST_ROOT}/secenv:${HOST_ROOT}/secenv"
      - "${HOST_ROOT}/secenv:/managed/secenv"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [control]
    pids_limit: 2048
    stop_grace_period: 90s
    restart: unless-stopped

  operator:
    build: ./operator
    environment:
      HOST_ROOT: ${HOST_ROOT}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN}
      MANAGE_ON_BOOT: "1"
      OPERATOR_LOG: /logs/operator.log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HOST_ROOT}:${HOST_ROOT}"
      - ./logs:/logs
    ports:
      - "127.0.0.1:${OPERATOR_PORT}:3199"
    networks: [control]
    restart: unless-stopped

networks:
  control:
    name: paperclip_control
